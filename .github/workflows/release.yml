name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Universal builds compile against both targets, so include both in
          # the cache key — otherwise switching between arm-only and universal
          # builds would invalidate the whole cache unnecessarily.
          key: universal
      - run: npm ci

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Build both architectures explicitly and lipo them ourselves. The
      # `tauri-action --target universal-apple-darwin` path in v0.5.7 silently
      # produced an arm64-only binary; doing the lipo step here is loud and
      # verifiable, and the subsequent tauri-action call reuses these built
      # artifacts (cargo fingerprint match) before bundling, signing, and
      # notarizing.
      - name: Build universal binary
        working-directory: src-tauri
        run: |
          set -ex
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/breach \
            target/x86_64-apple-darwin/release/breach \
            -output target/universal-apple-darwin/release/breach
          file target/universal-apple-darwin/release/breach
          lipo -info target/universal-apple-darwin/release/breach

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Signed and notarized macOS universal build (Apple Silicon + Intel).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Universal binary: lipos x86_64 and aarch64 slices into one .app.
          # The DMG roughly doubles in size (~10 MB → ~20 MB), but one
          # download serves both architectures.
          args: --target universal-apple-darwin

      # After a successful release, ping the Vercel deploy hook so the
      # marketing site rebuilds and its "Download for macOS" button picks up
      # the new DMG URL. The conditional means this is a no-op until the
      # secret is configured — safe to ship before the hook exists.
      - name: Trigger website rebuild
        if: success() && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK"
