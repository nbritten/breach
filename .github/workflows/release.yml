name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Caches are ref-scoped: a cache saved by one tag's run is invisible
          # to the next tag's run, but tag runs can restore caches saved on
          # main. warm-release-cache.yml builds with this same shared-key on
          # pushes to main so releases start warm; saving from here would be
          # dead weight, hence save-if: false.
          shared-key: universal
          save-if: "false"
      - run: npm ci

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # The release is created as a draft and only published after the
      # verify step below confirms both architecture slices are present —
      # the `--target universal-apple-darwin` path in tauri-action v0.5.7
      # silently produced an arm64-only binary once, and a draft is cheap
      # to delete while a published release is already live for updaters.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Signed and notarized macOS universal build (Apple Silicon + Intel).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Universal binary: lipos x86_64 and aarch64 slices into one .app.
          # The DMG roughly doubles in size (~10 MB → ~20 MB), but one
          # download serves both architectures.
          args: --target universal-apple-darwin

      - name: Verify universal binary
        run: |
          set -ex
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/Breach.app/Contents/MacOS/breach"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ steps.tauri.outputs.releaseId }}" \
            -F draft=false
